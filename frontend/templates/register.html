<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link href="/static/css/style.css" rel="stylesheet"/>

  </head>
  <body>
    
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid position-relative">

    <!-- Left logo -->
    <a class="navbar-brand ms-3" href="/">
      <img
        src="/static/images/blog.svg"
        alt="Blog Logo"
        width="50"
        height="40"
        class="d-inline-block align-text-top"
      />Blog
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNavAltMarkup"
      aria-controls="navbarNavAltMarkup"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">

      <!-- Centre section -->
      <div class="navbar-center">
        <div class="navbar-nav gap-lg-5">
          <a class="nav-link active" aria-current="page" href="/">Home</a>
          <a class="nav-link" href="#">Features</a>
          <a class="nav-link" href="#">Pricing</a>
        </div>

        <form class="d-flex ms-lg-5 mt-3 mt-lg-0" role="search">
          <input
            class="form-control me-2"
            type="search"
            placeholder="Search"
            aria-label="Search"
          />
          <button class="btn btn-outline-success" type="submit">
            Search
          </button>
        </form>
      </div>

      <!-- Right buttons -->
      <div class="navbar-auth ms-lg-auto me-lg-4 mt-3 mt-lg-0">
        <a class="btn btn-outline-success me-2" href="/login.html">
          Login
        </a>

        <a class="btn btn-success" href="/register.html">
          Sign-up
        </a>
      </div>

    </div>
  </div>
</nav>

    <main class="container d-flex justify-content-center min-vh-100 mt-4">
      <form method="post" id="registerForm">
        <h1 class="mb-5 mt-5 display-2">Create your account</h1>
        <div class="mb-3">
          <label for="email" class="form-label"
            >Email address <span class="text-danger">*</span></label
          >
          <input
            type="email"
            class="form-control custom-input"
            id="email"
            name="email"
            placeholder="email@example.com"
          />
          <div class="error-message" id="emailError"></div>
        </div>
        <div class="mb-3">
          <label for="username" class="form-label">Username <span class="text-danger">*</span></label>
          <input
            type="text"
            class="form-control"
            id="username"
            name="username"
            placeholder="username"
          />
          <div class="error-message" id="usernameError"></div>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
          />
          <div class="error-message" id="passwordError"></div>
        </div>
        <button type="submit" class="btn btn-outline-success">Sign up</button>
        <div class="mt-4" id="message"></div>
        <p class="login-text">
          Already have an account?
          <a href="/login.html">Sign in</a>
        </p>
      </form>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="/static/js/register.js"></script>
  </body>
</html>
